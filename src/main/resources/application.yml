server:
  port: 80

spring:
  datasource:
    url: jdbc:postgresql://192.168.0.113:5432/kotlin
    username: root
    password: password
    driverClassName: org.postgresql.Driver
  devtools:
    restart:
      enabled
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  messages:
    basename: i18n/messages
    encoding: UTF-8

logging:
  level:
    jp:
      co:
        casareal: debug
