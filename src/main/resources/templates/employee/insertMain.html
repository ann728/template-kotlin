<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新規追加画面</title>
    <link rel="stylesheet" href="../../static/css/style.css"
          th:href="@{/css/style.css}">
</head>
<body>
<h1>社員情報 新規追加</h1>
<a href="index.html" th:href="@{index}">社員一覧へ</a>
<form method="post" action="findById.html" th:action="@{insertComplete}">
    <table>
        <tr>
            <th>ID</th>
            <td>(自動採番されます)</td>
        </tr>
        <tr>
            <th>氏名</th>
            <td><input type="text" name="name"></td>
        </tr>
        <tr>
            <th>入社年月日</th>
            <td><input type="date" name="joinedDate"></td>
        </tr>
        <tr>
            <th>部署名</th>
            <td><input type="text" name="departmentName"></td>
        </tr>
        <tr>
            <th>メールアドレス</th>
            <td><input type="text" name="email"></td>
        </tr>
        <tr>
            <th>誕生日</th>
            <td><input type="date" name="birthDay"></td>
        </tr>
    </table>
    <button>登録</button>
</form>
</body>
</html>
