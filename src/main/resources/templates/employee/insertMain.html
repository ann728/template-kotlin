<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新規追加画面</title>
    <link rel="stylesheet" href="../../static/css/style.css"
          th:href="@{/css/style.css}">
    <style>
        .error {
            color: red;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
<h1>社員情報 新規追加</h1>
<a th:href="@{index}">社員一覧へ</a>

<form method="post" th:action="@{insertComplete}" th:object="${employeeForm}">
    <table>
        <tr>
            <th>ID</th>
            <td>(自動採番されます)</td>
        </tr>
        <tr>
            <th>氏名</th>
            <td>
                <input type="text" th:field="*{name}">
                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></div>
            </td>
        </tr>
        <tr>
            <th>入社年月日</th>
            <td>
                <input type="date" th:field="*{joinedDate}">
                <div th:if="${#fields.hasErrors('joinedDate')}" th:errors="*{joinedDate}" class="error"></div>
            </td>
        </tr>
        <tr>
            <th>部署名</th>
            <td>
                <input type="text" th:field="*{departmentName}">
                <div th:if="${#fields.hasErrors('departmentName')}" th:errors="*{departmentName}" class="error"></div>
            </td>
        </tr>
        <tr>
            <th>メールアドレス</th>
            <td>
                <input type="text" th:field="*{email}">
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></div>
            </td>
        </tr>
        <tr>
            <th>誕生日</th>
            <td>
                <input type="date" th:field="*{birthDay}">
                <div th:if="${#fields.hasErrors('birthDay')}" th:errors="*{birthDay}" class="error"></div>
            </td>
        </tr>
    </table>
    <button type="submit">登録</button>
</form>
</body>
</html>
